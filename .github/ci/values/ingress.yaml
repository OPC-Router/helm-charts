# Ingress with an ingress class and TLS
I_do_accept_the_EULA: true
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: opc-router.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: opc-router-example-tls
      hosts:
        - opc-router.example.com
