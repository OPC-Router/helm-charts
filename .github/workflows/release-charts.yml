name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      # Charts are packaged with the dependencies vendored in the repository, so a release does
      # not depend on a third-party chart index. Versions that are already tagged are skipped.
      - name: Package unreleased chart versions
        id: package
        run: |
          mkdir -p .cr-release-packages
          for dir in charts/*/; do
            name=$(helm show chart "$dir" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$dir" | awk '/^version:/ {print $2}')
            if git rev-parse -q --verify "refs/tags/${name}-${version}" > /dev/null; then
              echo "${name} ${version} is already released"
              continue
            fi
            helm package "$dir" --destination .cr-release-packages
          done
          if ls .cr-release-packages/*.tgz > /dev/null 2>&1; then
            echo "packaged=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-releaser
        if: steps.package.outputs.packaged == 'true'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
