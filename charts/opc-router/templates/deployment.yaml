apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opc-router.fullname" . }}
  labels:
    {{- include "opc-router.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.containerHistoryLimit }}
  replicas: 1
  {{- if or (not .Values.updateStrategy) (eq (dig "type" "" (.Values.updateStrategy | default dict)) "Recreate") }}
  {{- include "opc-router.strategySwitchGuard" . }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- else }}
  # The router mounts two ReadWriteOnce volumes in every mode. A rolling update starts the new pod
  # next to the old one: on another node it cannot attach them while the old pod holds them, and
  # with the embedded database it cannot open the database. So the old pod goes first.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "opc-router.workloadSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "opc-router.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opc-router.serviceAccountName" . }}
      # Only the project auto-update talks to the Kubernetes API.
      automountServiceAccountToken: {{ if and .Values.project.projectRepo (not .Values.project.autoUpdate.disable) }}true{{ else }}false{{ end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if .Values.webManagement.https.disable }}
            - containerPort: 8080
              protocol: TCP
              name: web-management
            {{- else }}
            - containerPort: 8443
              protocol: TCP
              name: web-management
            {{- end }}
            {{- if not .Values.mongodb.deploy }}
            - name: mongodb
              containerPort: 27017
              protocol: TCP
            {{- end }}
            {{- range .Values.service.extraPorts }}
            - name: {{ required "every entry of service.extraPorts needs a name" .name }}
              containerPort: {{ .targetPort | default (required "every entry of service.extraPorts needs a port" .port) }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          # Environment variables for the opcrouter container
          env:
          # Variables for connecting a service to the mongodb if a service is specified
          {{- if .Values.mongodb.deploy }}
          - name: OR_DATABASE_CONNECTION_STRING
            value: {{ include "getMongoDB" . }}
          {{- if .Values.mongodb.auth.enabled }}
          - name: OR_DATABASE_USERNAME
            value: root
          # Loading the password for the mongodb from secret
          - name: OR_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ if .Values.mongodb.auth.existingSecret }}{{ .Values.mongodb.auth.existingSecret }}{{ else }}{{ .Release.Name }}-mongodb{{ end }}
                key: mongodb-root-password
          {{- end }}
          {{- end }}
          - name: OR_WEB_DISABLE_HTTPS
            value: {{ .Values.webManagement.https.disable | quote }}
          {{- if not .Values.webManagement.https.disable }}
          - name: OR_WEB_HTTPS_CERTIFICATE_PEM_FILE
            value: /https/tls.crt
          - name: OR_WEB_HTTPS_CERTIFICATE_KEY_PEM_FILE
            value: /https/tls.key
          {{- end }}
          {{- if .Values.webManagement.auth.disable }}
          - name: OR_DISABLE_AUTH
            value: {{ .Values.webManagement.auth.disable | quote }}
          {{- else }}
          {{- with .Values.webManagement.auth.initialUser.name }}
          - name: INITIAL_USERNAME
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.webManagement.auth.initialUser.password }}
          - name: INITIAL_PASSWORD
            value: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.project.projectRepo }}
          - name: OR_IMPORT_SOURCE
            value: "/data/project/{{ .Values.project.projectPath }}"
          {{- $importMode := .Values.project.importMode | default "overwrite" }}
          {{- if eq $importMode "overwrite" }}
          - name: OR_IMPORT_OVERWRITE_EXISTING
            value: "true"
          {{- else if eq $importMode "clear" }}
          {{- include "opc-router.importClearGuard" . }}
          - name: OR_IMPORT_ALLOW_CLEAR_CONFIG
            value: "true"
          {{- else }}
          {{- fail (printf "project.importMode must be clear or overwrite, not %s" $importMode) }}
          {{- end }}
          - name: OR_IMPORT_RUNTIME_CONFIGURATION_FILE
            value: "/data/project/{{ .Values.project.configPath }}"
          {{- end }}
          {{-  if .Values.ingress.enabled }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          {{- end }}
          - name: OR_I_ACCEPT_EULA
            value: {{ .Values.I_do_accept_the_EULA | quote }}
          {{- $envNames := list }}
          {{- range .Values.envVars }}
          {{- $envNames = append $envNames (keys . | first) }}
          {{- end }}
          {{- range .Values.extraEnv }}
          {{- $envNames = append $envNames .name }}
          {{- end }}
          {{- if not (has "S6_BEHAVIOUR_IF_STAGE2_FAILS" $envNames) }}
          # Stop the container when a startup step fails, so Kubernetes restarts it instead of
          # leaving a running pod that never answers.
          - name: S6_BEHAVIOUR_IF_STAGE2_FAILS
            value: "2"
          {{- end }}
          # Loading environment variables specified in the values file
          {{- range .Values.envVars }}
          - name: "{{ keys . | first }}"
            value: "{{ values . | first }}"
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Volume mount for license
          volumeMounts:
          - mountPath: /data
            name: inray-volume
          - mountPath: /var/log/opcrouter
            name: log-volume
          {{- if not .Values.webManagement.https.disable }}
          - mountPath: /https
            name: https-volume
            readOnly: true
          {{- end }}
          {{- if .Values.project.projectRepo }}
          - mountPath: /data/project
            name: project-volume
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      {{- if .Values.project.projectRepo }}
        {{- if not .Values.project.autoUpdate.disable }}
        - name: kubernetes-proxy
          image: "{{ .Values.project.autoUpdate.kubectlImage.repository }}:{{ .Values.project.autoUpdate.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.project.autoUpdate.kubectlImage.pullPolicy }}
          # Gives the git-ops container access to the Kubernetes API on localhost:8001
          args: ["proxy"]
          {{- with .Values.helperResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: git-ops
          image: "{{ .Values.project.gitImage.repository }}:{{ .Values.project.gitImage.tag }}"
          imagePullPolicy: {{ .Values.project.gitImage.pullPolicy }}
          # Script for setting ssh credentials and cloning the repository onto the volume
          command: ["sh", "-c"]
          args:
          - >-
            {{- include "project.gitops" $ | indent 12}}
          {{- with .Values.helperResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Volume mount for the project and configuration file
          volumeMounts:
          - mountPath: /data/project
            name: project-volume
          {{- if (or .Values.project.auth.ssh_key .Values.project.auth.ssh_secret) }}
          - mountPath: /.ssh
            name: ssh-volume
            readOnly: true
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if and (not .Values.mongodb.deploy) (dig "enabled" false (.Values.mongodbLogRotation | default dict)) }}
        # The embedded database's log is not rotated by the image and grows until the volume is full.
        - name: mongodb-log-rotation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              {{- include "opc-router.mongodbLogRotation" . | nindent 14 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.helperResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /var/log/opcrouter
            name: log-volume
      {{- end }}
      {{- $prepareLogFolder := and (not .Values.mongodb.deploy) (ne .Values.prepareLogFolder false) }}
      {{- if or $prepareLogFolder .Values.project.projectRepo .Values.extraInitContainers }}
      initContainers:
      {{- if $prepareLogFolder }}
      # The embedded database's startup check writes into /var/log/opcrouter/mongodb before the image
      # creates that folder, so a new, empty log volume next to an existing database fails the start.
      # An image without a mongodb user has no embedded database and is left untouched.
      - name: prepare-log-folder
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["sh", "-c"]
        args:
          - if id mongodb > /dev/null 2>&1; then mkdir -p /var/log/opcrouter/mongodb && chown mongodb:mongodb /var/log/opcrouter/mongodb; fi
        # Upgrades add this container to running installations, so it takes the router's security
        # context and, without helperResources, the router's resources: a policy that admitted the
        # router admits it too, and an init container does not raise the pod's requests.
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with (.Values.helperResources | default .Values.resources) }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /var/log/opcrouter
          name: log-volume
      {{- end }}
      {{- if .Values.project.projectRepo }}
      # Init container for pulling the project files
      - name: pull-project
        image: "{{ .Values.project.gitImage.repository }}:{{ .Values.project.gitImage.tag }}"
        imagePullPolicy: {{ .Values.project.gitImage.pullPolicy }}
        # Script for setting ssh credentials and cloning the repository onto the volume
        command: ["sh", "-c"]
        args:
          - >-
          {{- include "project.clone" $ | indent 10}}
        {{- with .Values.helperResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # Volume mount for the project and configuration file
        volumeMounts:
        - mountPath: /data/project
          name: project-volume
        {{- if (or .Values.project.auth.ssh_key .Values.project.auth.ssh_secret) }}
        - mountPath: /.ssh
          name: ssh-volume
          readOnly: true
        {{- end }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      # Volume for the project and configuration file
      volumes:
      - name: inray-volume
        persistentVolumeClaim:
          claimName: {{ include "opc-router.inray.fullname" . }}
      - name: log-volume
        persistentVolumeClaim:
          claimName: {{ include "opc-router.log.fullname" . }}
      {{- if not .Values.webManagement.https.disable }}
      - name: https-volume
        secret:
          secretName: {{ .Values.webManagement.https.existingTlsSecret | default (printf "%s-%s" (include "opc-router.fullname" $) "tls-secret" | trunc 63 | trimSuffix "-")}}
      {{- end }}
      {{- if (or .Values.project.auth.ssh_key .Values.project.auth.ssh_secret) }}
      - name: ssh-volume
        secret:
          secretName: {{ .Values.project.auth.ssh_secret | default (printf "%s-%s" (include "opc-router.fullname" $) "ssh-secret" | trunc 63 | trimSuffix "-")}}
      {{- end }}
      {{- if .Values.project.projectRepo }}
      - name: project-volume
        emptyDir: {}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}