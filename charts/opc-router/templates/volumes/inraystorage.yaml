{{- if .Values.claims.inray.storageVolume.createVolume }}
{{- if and (eq (toString .Values.claims.inray.storageVolume.volumeType) "local") (not .Values.claims.inray.storageVolume.nodeAffinity) }}
{{- fail "claims.inray.storageVolume.nodeAffinity is required with volumeType local, because Kubernetes ties a local volume to one node: name the node there, or set createVolume=false and let a StorageClass provide the volume." }}
{{- end }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "opc-router.inray.fullname" . }}
  labels:
    type: local
    {{- include "opc-router.labels" . | nindent 4 }}
spec:
  {{- with .Values.claims.inray.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  capacity: 
    storage: {{ include "opc-router.claimCapacity" (list . "inray") }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ .Values.claims.inray.storageVolume.reclaimPolicy }}
  {{ .Values.claims.inray.storageVolume.volumeType }}:
  {{- with .Values.claims.inray.storageVolume.volumeTypeOptions }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  claimRef:
    name: {{ include "opc-router.inray.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- with .Values.claims.inray.storageVolume.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}